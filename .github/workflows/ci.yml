name: CI - Automated Testing & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify package installations
        run: |
          python -c "import yfinance, pandas, numpy, plotly, xgboost, sqlalchemy; print('✓ All core packages installed')"

      - name: Run ALL tests via pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "========================================="
          echo "Running Full Test Suite via pytest"
          echo "========================================="
          python -m pytest Tests/ -v --tb=short

      - name: Test Summary
        if: success()
        run: |
          echo "========================================="
          echo "✅ ALL TESTS PASSED SUCCESSFULLY"
          echo "========================================="

      - name: Test Failure Report
        if: failure()
        run: |
          echo "========================================="
          echo "❌ TESTS FAILED"
          echo "========================================="
          echo "Check the logs above for details"

  lint:
    name: Code Quality Check (Ruff + Mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff linting
        run: |
          echo "Running ruff code quality checks..."
          ruff check src/ --select=E9,F63,F7,F82 --output-format=text
          ruff check src/ --exit-zero --output-format=text --statistics

      - name: Run mypy type checking
        run: |
          echo "Running mypy type checks..."
          mypy src/ --ignore-missing-imports --no-error-summary || true

  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest Tests/ --cov=src --cov-report=term-missing --cov-fail-under=60

      - name: Generate HTML coverage report
        if: always()
        run: |
          python -m pytest Tests/ --cov=src --cov-report=html || true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        if: always()
